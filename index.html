<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    
    <title>IMPERIUM</title>
    
    <link rel="manifest" href="/manifest.json">
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Fond
              nuit: '#120D09',        // fond principal (remplace 'dark': '#0a0a0a')
              'nuit-deep': '#0A0705', // fond le plus sombre (headers, nav bar)
              card: '#1D1712',        // fond de carte standard (remplace 'card': '#121212')
              'card-warm': '#241B13', // fond de carte à accent chaud (ex: bandeau Jarvis)

              // Accents chauds (identité principale)
              terre: '#8B4226',       // terre-cuite, accent secondaire
              'terre-vif': '#B85C3A', // terre-cuite plus vive (icônes, highlights)
              gold: '#C9A227',        // remplace l'ancien gold '#D4AF37', plus mat/terreux
              'gold-vif': '#E8C55A',  // or plus lumineux (texte accent, valeurs chiffrées)

              // Accent froid de contraste
              indigo: '#2E4057',      // bleu profond (Coffre-fort, modules "info")
              'indigo-vif': '#4A6488',// variante plus claire

              // Texte
              ivoire: '#F1E9D8',      // texte clair principal (remplace le blanc/gris par défaut)
              'ivoire-dim': '#A69B87',// texte secondaire/atténué

              // États
              danger: '#B54834',      // rouille-alerte (remplace danger: '#ef4444', moins agressif)
              success: '#4A7856',     // vert sourd (remplace success: '#10b981')

              // Clés rétrocompatibilité transitoire
              dark: '#0a0a0a',
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #0a0a0a; color: #e5e5e5;
        overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
      }
      #root { width: 100%; min-height: 100%; display: flex; flex-direction: column; align-items: center; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
